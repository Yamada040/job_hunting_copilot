name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # paths-filter が PR の変更ファイルを API で取る

jobs:
  # 変わった場所を判定し、関係するジョブだけを走らせる。
  # on.pull_request.paths で起動ごと止める案は、起動しなかった必須チェックが待機中のまま残りマージできなくなるため採らない。
  # if: でスキップしたジョブは、必須チェックでは成功として扱われる
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "app/**"
              - "components/**"
              - "lib/**"
              - "public/**"
              - "proxy.ts"
              - "next.config.ts"
              - "next-env.d.ts"
              - "tsconfig.json"
              - "postcss.config.mjs"
              - "components.json"
              - "vitest.config.ts"
            backend:
              - "backend/**"
              - "supabase/**"
            e2e:
              - "e2e/**"
              - "playwright.config.ts"
              - ".github/actions/playwright/**"
            dependencies:
              - "package.json"
              - "package-lock.json"
              - ".nvmrc"
            workflows:
              - ".github/workflows/**"

  # 静的チェックを1ジョブに集約(npm ciを重複させない)。lint/type-check/format:check。
  # format:check はリポジトリ全体（md・yaml も）を見るので、変更した場所によらず常に走らせる
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check
      - name: APIの型が openapi.yaml と一致しているか確認
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api/schema.d.ts

  # 以降のジョブは、判定に失敗したら全部走らせる。
  # 判定ジョブの失敗で後続がスキップされると、必須チェックが成功扱いになり確かめずにマージできてしまうため
  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  unit:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  # 生成コードの鮮度・lint・テストを1ジョブにまとめる（Goのモジュールのダウンロードを重複させない）
  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 同時実行の正しさやユーザー間の分離は、本物と同じ構成のDBで確かめる（docs/backend-design.md 2章）。
    # supabase start は認証サーバーなどテストに不要なものまで起動して1分以上かかるため、
    # auth スキーマとロールを含む Supabase の Postgres イメージだけをサービスとして起動する。
    # イメージのタグは supabase start がローカルで使うもの（supabase/config.toml の major_version）に合わせる。
    # ECR Public からは取らない。ログインせずに取ると、ランナーで共有する IP ごとの取得量の上限（Data limit exceeded）で
    # テストの前に落ち続けることがあるため、GitHub のランナーから制限なく取れる ghcr.io の同じイメージを使う
    services:
      postgres:
        image: ghcr.io/supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: 生成コードが openapi.yaml・SQL と一致しているか確認
        run: |
          go generate ./...
          git diff --exit-code -- .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
      # Dependabot は脆弱性のある依存を知らせるだけで、その関数を実際に呼んでいるかは見ない。呼んでいる箇所を PR の時点で止める
      - name: 既知の脆弱性を呼んでいないか確認
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: マイグレーションを適用
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  # 本番ではなく、CIの中で起動した Supabase（認証とDB）とバックエンドにつないで確かめる（docs/testing/e2e-test-plan.md）。
  # フロントだけの変更では走らせない（時間がかかるため）。
  # 依存の変更では走らせる（Playwright・Next.js・@supabase/ssr の更新でログインやページの動きが変わりうるため）
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.dependencies == 'true' || needs.changes.outputs.workflows == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # mise.toml・release.yml と合わせる
      - run: npm run supabase:signing-key
      # 認証（GoTrue）・DB・その前段の API ゲートウェイだけを起動する
      - run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,mailpit,postgres-meta,postgrest,supavisor
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # リリース PR（dev → master）で、本番の DB に当たるマイグレーションを表示する（本番の DB は変えない）
  migrations:
    if: ${{ github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # mise.toml・release.yml と合わせる
      - run: npm run supabase:signing-key
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: 本番に当たるマイグレーションを表示する
        run: |
          supabase db push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "### 本番に当たるマイグレーション"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
