          $ref: "#/components/schemas/WebtestAttempt"
        xp:
          $ref: "#/components/schemas/XpResult"

    ContactRequest:
      type: object
      additionalProperties: false
      required: [subject, message]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 2000

    AdminStats:
      type: object
      required:
        [
          totalUsers,
          newUsers7d,
          activeUsers7d,
          activeUsersToday,
          totalEs,
          esCreated7d,
          totalCompanies,
          companiesCreated7d,
          totalInterviews,
          interviewsCreated7d,
          aiUsage,
        ]
      properties:
        totalUsers:
          type: integer
        newUsers7d:
          type: integer
        activeUsers7d:
          type: integer
          description: 直近7日間にXPを獲得したユーザー数
        activeUsersToday:
          type: integer
        totalEs:
          type: integer
        esCreated7d:
          type: integer
        totalCompanies:
          type: integer
        companiesCreated7d:
          type: integer
        totalInterviews:
          type: integer
        interviewsCreated7d:
          type: integer
        aiUsage:
          type: array
          description: AIの機能ごとのトークン数。全機能を決まった順で返す
          items:
            $ref: "#/components/schemas/AiUsage"

    AiUsage:
      type: object
      description: 1つのAI機能で、トークン数を記録した呼び出しの回数と合計。結果を上書きする機能・1回だけの機能は最新の1回分だけが残る
      required: [feature, calls, inputTokens, outputTokens]
      properties:
        feature:
          type: string
          enum: [es_review, interview_review, company_analysis, aptitude_diagnosis, self_analysis]
          description: 日本語の表示名はフロントエンドが持つ
        calls:
          type: integer
        inputTokens:
          type: integer
          description: 入力トークンの合計
        outputTokens:
          type: integer
          description: 出力トークンの合計（思考・推論の分を含む）

    Problem:
      type: object
      description: RFC 9457 Problem Details に、拡張項目 code と errors を加えたもの
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: エラーの種類を表すURI。種類を区別しない場合は about:blank
          example: about:blank
        title:
          type: string
          description: 利用者向けの日本語のメッセージ
          example: 入力内容に誤りがあります
        status:
          type: integer
          description: HTTPステータスコード
          example: 400
        detail:
          type: string
          description: この発生に固有の補足（任意）
        instance:
          type: string
          description: 発生したリクエストのパス（任意）
        code:
          type: string
          description: 機械が判定するための英語のコード
          example: validation_failed
        errors:
          type: array
          description: 項目ごとのエラー（入力チェックのとき）
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: タイトルは必須です
