openapi: 3.0.3
info:
  title: 就活copilot API
  version: 1.0.0
  description: |
    就活copilot のバックエンドAPI。設計は docs/backend-design.md を参照。
    このファイルが唯一の正であり、Go のサーバーと TypeScript のクライアントはここから生成する。

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 稼働確認
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      summary: 自分のプロフィールとXP・レベルを取得する
      description: プロフィールの行がまだ無いユーザーは、このときに作られる。
      responses:
        "200":
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: 自分のプロフィールを更新する
      description: 送った項目だけを更新する。空文字を送るとその項目を空にする（氏名は空にできない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: 更新後のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /v1/companies:
    get:
      operationId: listCompanies
      summary: 自分の企業の一覧を取得する
      description: 更新日時の新しい順。q を渡すと、正規化した企業名の部分一致で絞り込む（企業の候補の表示に使う）。
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 企業の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCompany
      summary: 企業を登録する
      description: 正規化した企業名が同じ企業がすでにあれば 409 を返す。登録でXPが付く（1日5回まで）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: 登録した企業と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCreated"
        default:
          $ref: "#/components/responses/Problem"

  /v1/companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: getCompany
      summary: 企業を1件取得する
      responses:
        "200":
          description: 企業
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCompany
      summary: 企業を更新する
      description: 送った項目だけを更新する。文字列の項目は空文字で、志望度は null で空にできる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: 更新後の企業
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCompany
      summary: 企業を削除する
      description: ひも付くES・面接ログ・カレンダーの予定も一緒に削除される。
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth が発行したアクセストークン

  responses:
    Problem:
      description: エラー（RFC 9457 Problem Details）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Me:
      type: object
      required:
        [id, fullName, university, faculty, avatarId, targetIndustry, careerAxis, goalState, xp, level, isDeveloper]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
          description: 氏名
        university:
          type: string
          nullable: true
          description: 大学
        faculty:
          type: string
          nullable: true
          description: 学部・学科
        avatarId:
          type: string
          nullable: true
          description: アバター
        targetIndustry:
          type: string
          nullable: true
          description: 志望業界
        careerAxis:
          type: string
          nullable: true
          description: 就活の軸
        goalState:
          type: string
          nullable: true
          description: 就活で達成したい状態
        xp:
          type: integer
          description: 合計XP
        level:
          type: integer
          description: レベル（XP ÷ 25 の切り捨て ＋ 1）
        isDeveloper:
          type: boolean
          description: 開発者向けの画面を使えるか

    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          maxLength: 100
        university:
          type: string
          maxLength: 100
        faculty:
          type: string
          maxLength: 100
        avatarId:
          type: string
          maxLength: 100
        targetIndustry:
          type: string
          maxLength: 100
        careerAxis:
          type: string
          maxLength: 100
        goalState:
          type: string
          maxLength: 100

    XpResult:
      type: object
      description: XPが付く操作での、XP付与の結果。付与されなかった場合も awarded を 0 にして現在の値を返す
      required: [awarded, total, level, leveledUp]
      properties:
        awarded:
          type: integer
          description: この操作で付与されたXP
        total:
          type: integer
          description: 付与後の合計XP
        level:
          type: integer
          description: 付与後のレベル
        leveledUp:
          type: boolean
          description: この操作でレベルが上がったか

    CompanyStage:
      type: string
      description: 選考状況。日本語の表示名はフロントエンドが持つ
      enum: [not_entered, entered, screening, interviewing, offered, rejected, declined]

    Company:
      type: object
      required:
        [
          id,
          name,
          industry,
          url,
          mypageId,
          mypageUrl,
          memo,
          stage,
          preference,
          favorite,
          aiResult,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        industry:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        mypageId:
          type: string
          nullable: true
        mypageUrl:
          type: string
          nullable: true
        memo:
          type: string
          nullable: true
        stage:
          $ref: "#/components/schemas/CompanyStage"
        preference:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 志望度（1〜5）
        favorite:
          type: boolean
        aiResult:
          type: string
          nullable: true
          description: AI企業分析の分析結果
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CompanyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        industry:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 500
        mypageId:
          type: string
          maxLength: 100
        mypageUrl:
          type: string
          maxLength: 500
        memo:
          type: string
          maxLength: 2000
        stage:
          $ref: "#/components/schemas/CompanyStage"
        preference:
          type: integer
          minimum: 1
          maximum: 5
        favorite:
          type: boolean

    CompanyUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        industry:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 500
        mypageId:
          type: string
          maxLength: 100
        mypageUrl:
          type: string
          maxLength: 500
        memo:
          type: string
          maxLength: 2000
        stage:
          $ref: "#/components/schemas/CompanyStage"
        preference:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          # 「項目が送られていない（変更しない）」と「null（未設定に戻す）」を区別するため、この項目だけ nullable.Nullable にする
          x-go-type: nullable.Nullable[int]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        favorite:
          type: boolean

    CompanyCreated:
      type: object
      required: [company, xp]
      properties:
        company:
          $ref: "#/components/schemas/Company"
        xp:
          $ref: "#/components/schemas/XpResult"

    Problem:
      type: object
      description: RFC 9457 Problem Details に、拡張項目 code と errors を加えたもの
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: エラーの種類を表すURI。種類を区別しない場合は about:blank
          example: about:blank
        title:
          type: string
          description: 利用者向けの日本語のメッセージ
          example: 入力内容に誤りがあります
        status:
          type: integer
          description: HTTPステータスコード
          example: 400
        detail:
          type: string
          description: この発生に固有の補足（任意）
        instance:
          type: string
          description: 発生したリクエストのパス（任意）
        code:
          type: string
          description: 機械が判定するための英語のコード
          example: validation_failed
        errors:
          type: array
          description: 項目ごとのエラー（入力チェックのとき）
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: タイトルは必須です
