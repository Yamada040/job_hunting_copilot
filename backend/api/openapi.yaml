openapi: 3.0.3
info:
  title: 就活copilot API
  version: 1.0.0
  description: |
    就活copilot のバックエンドAPI。設計は docs/backend-design.md を参照。
    このファイルが唯一の正であり、Go のサーバーと TypeScript のクライアントはここから生成する。

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 稼働確認
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      summary: 自分のプロフィールとXP・レベルを取得する
      description: プロフィールの行がまだ無いユーザーは、このときに作られる。
      responses:
        "200":
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: 自分のプロフィールを更新する
      description: 送った項目だけを更新する。空文字を送るとその項目を空にする（氏名は空にできない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: 更新後のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth が発行したアクセストークン

  responses:
    Problem:
      description: エラー（RFC 9457 Problem Details）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Me:
      type: object
      required:
        [id, fullName, university, faculty, avatarId, targetIndustry, careerAxis, goalState, xp, level, isDeveloper]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          nullable: true
          description: 氏名
        university:
          type: string
          nullable: true
          description: 大学
        faculty:
          type: string
          nullable: true
          description: 学部・学科
        avatarId:
          type: string
          nullable: true
          description: アバター
        targetIndustry:
          type: string
          nullable: true
          description: 志望業界
        careerAxis:
          type: string
          nullable: true
          description: 就活の軸
        goalState:
          type: string
          nullable: true
          description: 就活で達成したい状態
        xp:
          type: integer
          description: 合計XP
        level:
          type: integer
          description: レベル（XP ÷ 25 の切り捨て ＋ 1）
        isDeveloper:
          type: boolean
          description: 開発者向けの画面を使えるか

    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          maxLength: 100
        university:
          type: string
          maxLength: 100
        faculty:
          type: string
          maxLength: 100
        avatarId:
          type: string
          maxLength: 100
        targetIndustry:
          type: string
          maxLength: 100
        careerAxis:
          type: string
          maxLength: 100
        goalState:
          type: string
          maxLength: 100

    Problem:
      type: object
      description: RFC 9457 Problem Details に、拡張項目 code と errors を加えたもの
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: エラーの種類を表すURI。種類を区別しない場合は about:blank
          example: about:blank
        title:
          type: string
          description: 利用者向けの日本語のメッセージ
          example: 入力内容に誤りがあります
        status:
          type: integer
          description: HTTPステータスコード
          example: 400
        detail:
          type: string
          description: この発生に固有の補足（任意）
        instance:
          type: string
          description: 発生したリクエストのパス（任意）
        code:
          type: string
          description: 機械が判定するための英語のコード
          example: validation_failed
        errors:
          type: array
          description: 項目ごとのエラー（入力チェックのとき）
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: タイトルは必須です
