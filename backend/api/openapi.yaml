          $ref: "#/components/schemas/XpResult"

    WebtestQuestionSummary:
      type: object
      required: [id, title, testType, category, format, difficulty, timeLimit, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        testType:
          type: string
          nullable: true
          description: テストの種類（SPI・玉手箱など）
        category:
          type: string
          nullable: true
        format:
          type: string
          nullable: true
        difficulty:
          type: string
          nullable: true
        timeLimit:
          type: integer
          nullable: true
          description: 制限時間（秒）
        createdAt:
          type: string
          format: date-time

    WebtestQuestionDetail:
      allOf:
        - $ref: "#/components/schemas/WebtestQuestionSummary"
        - type: object
          required: [body, choices, answer, explanation, attempts]
          properties:
            body:
              type: string
            choices:
              type: array
              items:
                type: string
            answer:
              type: string
            explanation:
              type: string
              nullable: true
            attempts:
              type: array
              description: 解答の記録（新しい順）
              items:
                $ref: "#/components/schemas/WebtestAttempt"

    WebtestQuestionCreate:
      type: object
      additionalProperties: false
      required: [title, body, answer]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        body:
          type: string
          minLength: 1
          maxLength: 5000
        answer:
          type: string
          minLength: 1
          maxLength: 500
        choices:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500
        explanation:
          type: string
          maxLength: 5000
        testType:
          type: string
          maxLength: 50
        category:
          type: string
          maxLength: 50
        format:
          type: string
          maxLength: 50
        difficulty:
          type: string
          maxLength: 50
        timeLimit:
          type: integer
          minimum: 0
          maximum: 3600

    WebtestQuestionCreated:
      type: object
      required: [question, xp]
      properties:
        question:
          $ref: "#/components/schemas/WebtestQuestionDetail"
        xp:
          $ref: "#/components/schemas/XpResult"

    WebtestAttempt:
      type: object
      required: [id, isCorrect, timeSpent, createdAt]
      properties:
        id:
          type: string
          format: uuid
        isCorrect:
          type: boolean
        timeSpent:
          type: integer
          nullable: true
          description: かかった時間（秒）
        createdAt:
          type: string
          format: date-time

    WebtestAnswer:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          type: string
          maxLength: 500
        timeSpent:
          type: integer
          minimum: 0
          maximum: 36000

    WebtestAnswered:
      type: object
      required: [attempt, xp]
      properties:
