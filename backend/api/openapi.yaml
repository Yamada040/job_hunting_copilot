openapi: 3.0.3
info:
  title: 就活copilot API
  version: 1.0.0
  description: |
    就活copilot のバックエンドAPI。設計は docs/backend-design.md を参照。
    このファイルが唯一の正であり、バックエンドのサーバーと TypeScript のクライアントはここから生成する。

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 稼働確認
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      summary: 自分のプロフィールとXP・レベルを取得する
      description: プロフィールの行がまだ無いユーザーは、このときに作られる。
      responses:
        "200":
          description: 自分のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: 自分のプロフィールを更新する
      description: 送った項目だけを更新する。空文字を送るとその項目を空にする（氏名は空にできない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: 更新後のプロフィール
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /v1/companies:
    get:
      operationId: listCompanies
      summary: 自分の企業の一覧を取得する
      description: 更新日時の新しい順。q を渡すと、正規化した企業名の部分一致で絞り込む（企業の候補の表示に使う）。
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: 企業の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCompany
      summary: 企業を登録する
      description: 正規化した企業名が同じ企業がすでにあれば 409 を返す。登録でXPが付く（1日5回まで）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: 登録した企業と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyCreated"
        default:
          $ref: "#/components/responses/Problem"

  /v1/companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: getCompany
      summary: 企業を1件取得する
      responses:
        "200":
          description: 企業
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateCompany
      summary: 企業を更新する
      description: 送った項目だけを更新する。文字列の項目は空文字で、志望度は null で空にできる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: 更新後の企業
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCompany
      summary: 企業を削除する
      description: ひも付くES・面接ログ・カレンダーの予定も一緒に削除される。
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Problem"

  /v1/companies/{companyId}/analysis:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    post:
      operationId: analyzeCompany
      summary: AI企業分析を行う
      description: AIがWeb検索をしながら企業を分析し、分析結果を保存して返す。企業ごとに1回だけで、2回目は 409。完成してからまとめて返す（数十秒かかる）。
      responses:
        "200":
          description: 分析結果を保存した企業
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Problem"

  /v1/es-entries:
    get:
      operationId: listEsEntries
      summary: 自分のESの一覧を取得する
      description: 更新日時の新しい順。companyId を渡すとその企業のESだけに絞る。
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: ESの一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EsEntry"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEsEntry
      summary: ESを作成する（常に下書き）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EsEntryCreate"
      responses:
        "201":
          description: 作成したES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsEntry"
        default:
          $ref: "#/components/responses/Problem"

  /v1/es-entries/{esEntryId}:
    parameters:
      - $ref: "#/components/parameters/EsEntryId"
    get:
      operationId: getEsEntry
      summary: ESを1件取得する
      responses:
        "200":
          description: ES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsEntry"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateEsEntry
      summary: ESを更新する
      description: 送った項目だけを更新する。状態（下書き・提出済み）はここでは変えられず、提出は /submit で行う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EsEntryUpdate"
      responses:
        "200":
          description: 更新後のES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsEntry"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteEsEntry
      summary: ESを削除する
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Problem"

  /v1/es-entries/{esEntryId}/submit:
    parameters:
      - $ref: "#/components/parameters/EsEntryId"
    post:
      operationId: submitEsEntry
      summary: ESを提出済みにする
      description: 提出は取り消せない（下書きには戻せない）。XPが付く（同じESには1回、1日5回まで）。提出済みのESにもう一度呼んでもエラーにはせず、XPは付かない。
      responses:
        "200":
          description: 提出済みのESと、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsEntrySubmitted"
        default:
          $ref: "#/components/responses/Problem"

  /v1/es-entries/{esEntryId}/reviews:
    parameters:
      - $ref: "#/components/parameters/EsEntryId"
    get:
      operationId: listEsReviews
      summary: ESのAI添削の履歴を取得する
      description: 新しい順。点数の推移を見せるため、添削のたびに1件ずつ残している。
      responses:
        "200":
          description: 添削結果の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EsReview"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: reviewEsEntry
      summary: AI添削を行う
      description: 保存済みのESの内容をAIが添削し、添削結果を履歴に1件足して返す。何度でも実行できる（1日の上限あり）。
      responses:
        "201":
          description: 保存した添削結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsReview"
        default:
          $ref: "#/components/responses/Problem"

  /v1/interview-logs:
    get:
      operationId: listInterviewLogs
      summary: 自分の面接ログの一覧を取得する
      description: 面接日の新しい順。companyId を渡すとその企業の面接ログだけに絞る。
      parameters:
        - name: companyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: 面接ログの一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewLog"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInterviewLog
      summary: 面接ログを作成する
      description: XPが付く（同じ面接ログには1回、1日5回まで）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewLogCreate"
      responses:
        "201":
          description: 作成した面接ログと、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewLogCreated"
        default:
          $ref: "#/components/responses/Problem"

  /v1/interview-logs/{interviewLogId}:
    parameters:
      - $ref: "#/components/parameters/InterviewLogId"
    get:
      operationId: getInterviewLog
      summary: 面接ログを1件取得する
      responses:
        "200":
          description: 面接ログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewLog"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateInterviewLog
      summary: 面接ログを更新する
      description: 送った項目だけを更新する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewLogUpdate"
      responses:
        "200":
          description: 更新後の面接ログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewLog"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInterviewLog
      summary: 面接ログを削除する
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Problem"

  /v1/interview-logs/{interviewLogId}/review:
    parameters:
      - $ref: "#/components/parameters/InterviewLogId"
    post:
      operationId: reviewInterviewLog
      summary: AI振り返りを行う
      description: 保存済みの面接ログをAIが振り返り、振り返り結果を保存して返す。何度でも実行でき、結果は上書きする（1日の上限あり）。
      responses:
        "200":
          description: 振り返り結果を保存した面接ログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewLog"
        default:
          $ref: "#/components/responses/Problem"

  /v1/calendar-events:
    get:
      operationId: listCalendarItems
      summary: カレンダーに表示する予定を取得する
      description: ユーザーが登録した予定と、ESの締切をまとめて日付順に返す。from・to（どちらも含む）で期間を絞れる。
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 予定とESの締切
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarItem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCalendarEvent
      summary: 予定を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventCreate"
      responses:
        "201":
          description: 登録した予定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        default:
          $ref: "#/components/responses/Problem"

  /v1/calendar-feed:
    get:
      operationId: getCalendarFeed
      summary: カレンダーの購読用URLを作ってあるかを取得する
      description: URLそのものは作ったときにしか返さない（トークンはハッシュだけを保存しているため）。
      responses:
        "200":
          description: 購読用URLの状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeedStatus"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createCalendarFeed
      summary: カレンダーの購読用URLを作る（作り直す）
      description: 作り直すと、前に作ったURLは使えなくなる。返したトークンは二度と取得できない。
      responses:
        "201":
          description: 作ったトークン。URLは /v1/calendar-feed/{token}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarFeedCreated"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCalendarFeed
      summary: カレンダーの購読用URLを止める
      responses:
        "204":
          description: 止めた（作っていなくても成功する）
        default:
          $ref: "#/components/responses/Problem"

  /v1/calendar-feed/{token}:
    get:
      operationId: getCalendarFeedIcal
      summary: 購読用URL。予定とESの締切を iCal 形式で返す
      description: Googleカレンダーなどが、ログインせずに定期的に読みに来る。トークンが合わなければ 404 を返す。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: iCal（RFC 5545）
          content:
            text/calendar:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /v1/calendar-events/{calendarEventId}:
    parameters:
      - $ref: "#/components/parameters/CalendarEventId"
    patch:
      operationId: updateCalendarEvent
      summary: 予定を更新する
      description: 送った項目だけを更新する。時刻と企業は null で空にできる。ESの締切はESの画面で変える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarEventUpdate"
      responses:
        "200":
          description: 更新後の予定
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCalendarEvent
      summary: 予定を削除する
      responses:
        "204":
          description: 削除した
        default:
          $ref: "#/components/responses/Problem"

  /v1/xp-logs:
    get:
      operationId: listXpLogs
      summary: XPの獲得履歴を取得する
      description: 新しい順。
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: XPの獲得履歴
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XpLog"
        default:
          $ref: "#/components/responses/Problem"

  /v1/aptitude-result:
    get:
      operationId: getAptitudeResult
      summary: 自分の適性診断の回答と診断結果を取得する
      description: まだ回答していなければ null を返す（回答が無いのはエラーではなく普通の状態なので、404 にはしない）。
      responses:
        "200":
          description: 適性診断。まだ回答していなければ null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AptitudeResult"
                nullable: true
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: submitAptitudeAnswers
      summary: 適性診断の回答を保存する
      description: 1人1回だけで、2回目は 409。初回はXPが付く。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  $ref: "#/components/schemas/AptitudeAnswers"
      responses:
        "201":
          description: 保存した回答と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AptitudeSubmitted"
        default:
          $ref: "#/components/responses/Problem"

  /v1/aptitude-result/diagnosis:
    post:
      operationId: diagnoseAptitude
      summary: AI適性診断を行う
      description: 保存済みの回答をもとにAI適性診断を行い、診断結果を保存して返す。1回だけで、2回目は 409。
      responses:
        "200":
          description: 診断結果を保存した適性診断
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AptitudeResult"
        default:
          $ref: "#/components/responses/Problem"

  /v1/self-analysis-result:
    get:
      operationId: getSelfAnalysisResult
      summary: 自分の自己分析の回答と分析結果を取得する
      description: まだ回答していなければ null を返す（回答が無いのはエラーではなく普通の状態なので、404 にはしない）。
      responses:
        "200":
          description: 自己分析。まだ回答していなければ null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SelfAnalysisResult"
                nullable: true
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: submitSelfAnalysisAnswers
      summary: 自己分析の回答を保存する
      description: 1人1回だけで、2回目は 409。初回はXPが付く。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [answers]
              properties:
                answers:
                  $ref: "#/components/schemas/SelfAnalysisAnswers"
      responses:
        "201":
          description: 保存した回答と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfAnalysisSubmitted"
        default:
          $ref: "#/components/responses/Problem"

  /v1/self-analysis-result/analysis:
    post:
      operationId: analyzeSelf
      summary: AI自己分析を行う
      description: 保存済みの回答をもとにAI自己分析を行い、分析結果を保存して返す。1回だけで、2回目は 409。
      responses:
        "200":
          description: 分析結果を保存した自己分析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfAnalysisResult"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webtest-questions:
    get:
      operationId: listWebtestQuestions
      summary: 自分が作ったWebテストの問題の一覧を取得する
      description: 作成日時の新しい順。testType を渡すとその種類の問題だけに絞る。
      parameters:
        - name: testType
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
      responses:
        "200":
          description: 問題の一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebtestQuestionSummary"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWebtestQuestion
      summary: Webテストの問題を作る
      description: XPが付く（1日3回まで）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebtestQuestionCreate"
      responses:
        "201":
          description: 作った問題と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebtestQuestionCreated"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webtest-questions/{webtestQuestionId}:
    parameters:
      - $ref: "#/components/parameters/WebtestQuestionId"
    get:
      operationId: getWebtestQuestion
      summary: 問題と、これまでの解答の記録を取得する
      responses:
        "200":
          description: 問題と解答の記録
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebtestQuestionDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/webtest-questions/{webtestQuestionId}/attempts:
    parameters:
      - $ref: "#/components/parameters/WebtestQuestionId"
    post:
      operationId: answerWebtestQuestion
      summary: 問題に解答する
      description: 正誤はバックエンドが判定する（前後の空白と英字の大文字・小文字は無視）。XPが付く（1日2回まで）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebtestAnswer"
      responses:
        "201":
          description: 解答の記録と、付与されたXP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebtestAnswered"
        default:
          $ref: "#/components/responses/Problem"

  /v1/contact:
    post:
      operationId: sendContact
      summary: 問い合わせを運営にメールで送る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "204":
          description: 送信した
        default:
          $ref: "#/components/responses/Problem"

  /v1/admin/stats:
    get:
      operationId: getAdminStats
      summary: 利用状況の集計を取得する（開発者のみ）
      description: 開発者でなければ 403。「直近」は7日間、「今日」は日本時間の今日。
      responses:
        "200":
          description: 利用状況
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        default:
          $ref: "#/components/responses/Problem"

