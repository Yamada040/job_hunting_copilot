name: Backup

# Supabase の無料プランは自動のバックアップが使えないため、毎日、本番の DB を暗号化したダンプとして成果物に残す。
# 失敗したら GitHub からメールが届く。復元の手順は docs/backup.md
on:
  schedule:
    - cron: "0 18 * * *" # 毎日 3:00（日本時間）。使う人が少ない時間に取る
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # mise.toml・ci.yml・release.yml と合わせる
      # config.toml が手元・CI用の JWT の署名鍵のファイルを指しており、無いと CLI が止まる。本番には使わないので使い捨てで作る
      - run: npm run supabase:signing-key
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # 退会したユーザーのデータがバックアップに残る期間を短くするため、1週間で消す
      - uses: ./.github/actions/db-backup
        with:
          name: db-backup-${{ github.run_id }}
          retention-days: 7
          passphrase: ${{ secrets.BACKUP_PASSPHRASE }}
