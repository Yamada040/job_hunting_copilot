name: Keepalive

# Supabase の無料プランは、7日間アクセスが無いとプロジェクトを一時停止する。
# バックエンドの /v1/health は DB に接続して確かめるので、毎日呼んでアクセスを途切れさせない。
# 失敗したら GitHub からメールが届く（一時停止の前に気づける）
on:
  schedule:
    - cron: "0 0 * * *" # 毎日 9:00（日本時間）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 関数のコールドスタートや一時的な失敗で落ちないよう、数回やり直す
      - run: curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors https://job-seeker-gray.vercel.app/v1/health
