name: Go

on:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  # 生成コードの鮮度・lint・テストを1ジョブにまとめる（Goのモジュールのダウンロードを重複させない）
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: 生成コードが openapi.yaml・SQL と一致しているか確認
        run: |
          go generate ./...
          git diff --exit-code -- .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
      # 同時実行の正しさやユーザー間の分離は、本物と同じ構成のDBで確かめる（docs/backend-design.md 2章）
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: ローカルの Supabase を起動してマイグレーションを適用
        working-directory: .
        run: supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,mailpit,postgres-meta
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
