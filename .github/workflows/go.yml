name: Go

on:
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  # 生成コードの鮮度・lint・テストを1ジョブにまとめる（Goのモジュールのダウンロードを重複させない）
  go:
    runs-on: ubuntu-latest
    # 同時実行の正しさやユーザー間の分離は、本物と同じ構成のDBで確かめる（docs/backend-design.md 2章）。
    # supabase start は認証サーバーなどテストに不要なものまで起動して1分以上かかるため、
    # auth スキーマとロールを含む Supabase の Postgres イメージだけをサービスとして起動する。
    # イメージのタグは supabase start がローカルで使うもの（supabase/config.toml の major_version）に合わせる。
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: 生成コードが openapi.yaml・SQL と一致しているか確認
        run: |
          go generate ./...
          git diff --exit-code -- .
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend
      - name: マイグレーションを適用
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
